<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Lookup — Cyber Security Toolkit Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/toolkit-theme.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="scanline-overlay"></div>
<nav class="navbar">
  <a href="../index.html" class="nav-brand"><span class="glow-text">CST</span><span>_Pro</span></a>
  <a href="../index.html#tools" class="nav-back">&larr; All Tools</a>
</nav>
<main class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">// tool_id: 04</p>
    <h1 class="glow-text tool-title">IP Information Lookup</h1>
    <p class="tool-subtitle">Look up geolocation and network details for any IP address, or leave blank for your own.</p>
  </div>

  <section class="glass-card" style="padding:1.75rem;margin-bottom:1.5rem;">
    <div class="output-row">
      <input type="text" id="ipInput" placeholder="e.g. 8.8.8.8 (leave blank for your own IP)" class="password-display">
      <button class="btn-cyber" id="ipLookupBtn">Lookup</button>
    </div>
  </section>

  <section class="glass-card" id="ipResults" style="padding:1.75rem;display:none;">
    <div id="ipResultGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;font-family:var(--font-mono);font-size:0.9rem;"></div>
  </section>

  <section class="glass-card" id="portsResults" style="padding:1.75rem;margin-top:1.5rem;display:none;">
    <p class="eyebrow" style="margin-bottom:0.8rem;">Open Ports &amp; Passive Recon <span style="color:var(--text-dim);font-weight:400;">(via Shodan InternetDB — no active scanning)</span></p>
    <div id="portsChipList" style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;"></div>
    <div id="tagsChipList" style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;"></div>
    <div id="hostnamesList" style="font-family:var(--font-mono);font-size:0.85rem;color:var(--text-dim);"></div>
  </section>

  <div id="ipLoading" style="display:none;text-align:center;padding:2rem;"><div class="loader-spinner"></div></div>
  <p id="ipError" style="color:var(--danger);text-align:center;margin-top:1rem;"></p>
</main>

<script src="../js/ip-lookup.js"></script>
</body>
</html>
