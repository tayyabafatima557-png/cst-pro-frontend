<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator — Cyber Security Toolkit Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/toolkit-theme.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="scanline-overlay"></div>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <a href="../index.html" class="nav-brand">
    <span class="glow-text">CST</span><span>_Pro</span>
  </a>
  <a href="../index.html#tools" class="nav-back">&larr; All Tools</a>
</nav>

<!-- ================= MAIN ================= -->
<main class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">// tool_id: 01</p>
    <h1 class="glow-text tool-title">Password Generator</h1>
    <p class="tool-subtitle">Generate cryptographically strong, unpredictable passwords using your browser's secure random number source.</p>
  </div>

  <div class="tool-panel-grid">

    <!-- Output panel -->
    <section class="glass-card output-card">
      <div class="output-row">
        <input type="text" id="passwordOutput" class="password-display" readonly value="Click Generate ↓" aria-label="Generated password">
        <button class="btn-icon" id="copyBtn" title="Copy to clipboard" aria-label="Copy password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="btn-icon" id="regenBtn" title="Regenerate" aria-label="Regenerate password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>

      <div class="strength-meter">
        <div class="strength-meter-fill" id="strengthFill"></div>
      </div>
      <p class="strength-label" id="strengthLabel">Strength: —</p>
    </section>

    <!-- Options panel -->
    <section class="glass-card options-card">
      <div class="option-block">
        <div class="option-row">
          <label for="lengthSlider" class="eyebrow">Length</label>
          <span id="lengthValue" class="glow-text mono-value">16</span>
        </div>
        <input type="range" id="lengthSlider" min="6" max="64" value="16">
      </div>

      <div class="checkbox-grid">
        <label class="cyber-checkbox">
          <input type="checkbox" id="optUpper" checked>
          <span>Uppercase (A–Z)</span>
        </label>
        <label class="cyber-checkbox">
          <input type="checkbox" id="optLower" checked>
          <span>Lowercase (a–z)</span>
        </label>
        <label class="cyber-checkbox">
          <input type="checkbox" id="optNumbers" checked>
          <span>Numbers (0–9)</span>
        </label>
        <label class="cyber-checkbox">
          <input type="checkbox" id="optSymbols" checked>
          <span>Symbols (!@#$…)</span>
        </label>
        <label class="cyber-checkbox">
          <input type="checkbox" id="optExcludeAmbiguous">
          <span>Exclude ambiguous (0/O, 1/l/I)</span>
        </label>
      </div>

      <button class="btn-cyber generate-btn" id="generateBtn">Generate Password</button>
    </section>

  </div>

  <!-- History -->
  <section class="glass-card history-card">
    <div class="history-header">
      <p class="eyebrow">Session history</p>
      <button class="btn-link" id="clearHistoryBtn">Clear</button>
    </div>
    <ul id="historyList" class="history-list">
      <li class="history-empty">No passwords generated yet this session.</li>
    </ul>
  </section>
</main>

<div class="toast-cyber" id="toast">Copied to clipboard</div>

<script src="../js/password-generator.js"></script>
</body>
</html>
