<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subdomain Finder — Cyber Security Toolkit Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/toolkit-theme.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="scanline-overlay"></div>
<nav class="navbar">
  <a href="../index.html" class="nav-brand"><span class="glow-text">CST</span><span>_Pro</span></a>
  <a href="../index.html#tools" class="nav-back">&larr; All Tools</a>
</nav>
<main class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">// tool_id: 14</p>
    <h1 class="glow-text tool-title">Subdomain Finder</h1>
    <p class="tool-subtitle">Discover subdomains via Certificate Transparency logs — a passive OSINT technique using publicly logged SSL certificates.</p>
  </div>

  <section class="glass-card" style="padding:1.75rem;margin-bottom:1.5rem;">
    <div class="output-row">
      <input type="text" id="subdomainInput" placeholder="e.g. example.com" class="password-display">
      <button class="btn-cyber" id="subdomainSearchBtn">Find</button>
    </div>
    <p style="font-size:0.8rem;color:var(--text-dim);margin-top:0.6rem;">Powered by <a href="https://crt.sh" target="_blank" style="color:var(--cyan);">crt.sh</a> — passive lookup only, no active scanning of the target.</p>
  </section>

  <div id="subdomainLoading" style="display:none;text-align:center;padding:2rem;"><div class="loader-spinner"></div></div>
  <p id="subdomainError" style="color:var(--danger);text-align:center;margin-top:1rem;"></p>

  <section class="glass-card" id="subdomainResults" style="padding:1.75rem;display:none;">
    <p class="eyebrow" style="margin-bottom:1rem;" id="subdomainCount"></p>
    <div id="subdomainList" style="display:flex;flex-direction:column;gap:0.5rem;font-family:var(--font-mono);font-size:0.85rem;max-height:500px;overflow-y:auto;"></div>
  </section>
</main>

<script src="../js/subdomain-finder.js"></script>
</body>
</html>
