<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash Generator — Cyber Security Toolkit Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/toolkit-theme.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="scanline-overlay"></div>
<nav class="navbar">
  <a href="../index.html" class="nav-brand"><span class="glow-text">CST</span><span>_Pro</span></a>
  <a href="../index.html#tools" class="nav-back">&larr; All Tools</a>
</nav>
<main class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">// tool_id: 03</p>
    <h1 class="glow-text tool-title">Hash Generator &amp; Checker</h1>
    <p class="tool-subtitle">Generate MD5, SHA-1 and SHA-256 hashes, or compare two hashes to verify a match.</p>
  </div>

  <section class="glass-card" style="padding:1.75rem;margin-bottom:1.5rem;">
    <p class="eyebrow" style="margin-bottom:0.6rem;">Input text</p>
    <textarea id="hashInput" rows="4" placeholder="Type or paste text to hash…"
      style="width:100%;background:var(--bg-panel-raised);border:1px solid var(--border-glow);border-radius:8px;color:var(--text-primary);font-family:var(--font-mono);padding:0.85rem;resize:vertical;"></textarea>
  </section>

  <section class="glass-card" style="padding:1.75rem;">
    <div id="hashResults" style="display:flex;flex-direction:column;gap:1rem;">
      <div class="hash-row" data-algo="MD5">
        <p class="eyebrow">MD5</p>
        <div class="output-row"><input readonly class="password-display" value="—"><button class="btn-icon copy-hash" title="Copy">📋</button></div>
      </div>
      <div class="hash-row" data-algo="SHA-1">
        <p class="eyebrow">SHA-1</p>
        <div class="output-row"><input readonly class="password-display" value="—"><button class="btn-icon copy-hash" title="Copy">📋</button></div>
      </div>
      <div class="hash-row" data-algo="SHA-256">
        <p class="eyebrow">SHA-256</p>
        <div class="output-row"><input readonly class="password-display" value="—"><button class="btn-icon copy-hash" title="Copy">📋</button></div>
      </div>
    </div>
  </section>

  <section class="glass-card" style="padding:1.75rem;margin-top:1.5rem;">
    <p class="eyebrow" style="margin-bottom:0.8rem;">Hash comparison</p>
    <div style="display:flex;flex-direction:column;gap:0.8rem;">
      <input type="text" id="hashCompareA" placeholder="Paste first hash…" class="password-display" style="width:100%;">
      <input type="text" id="hashCompareB" placeholder="Paste second hash…" class="password-display" style="width:100%;">
    </div>
    <p id="compareResult" style="margin-top:1rem;font-family:var(--font-mono);color:var(--text-dim);">Enter two hashes to compare.</p>
  </section>
</main>

<div class="toast-cyber" id="toast">Copied to clipboard</div>

<script src="../js/tools.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
<script src="../js/hash-generator.js"></script>
</body>
</html>
