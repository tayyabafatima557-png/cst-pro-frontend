<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JWT Decoder — Cyber Security Toolkit Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/toolkit-theme.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="scanline-overlay"></div>
<nav class="navbar">
  <a href="../index.html" class="nav-brand"><span class="glow-text">CST</span><span>_Pro</span></a>
  <a href="../index.html#tools" class="nav-back">&larr; All Tools</a>
</nav>
<main class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">// tool_id: 11</p>
    <h1 class="glow-text tool-title">JWT Decoder</h1>
    <p class="tool-subtitle">Decode a JSON Web Token's header and payload. This does not verify the signature — decoding only.</p>
  </div>

  <section class="glass-card" style="padding:1.75rem;margin-bottom:1.5rem;">
    <p class="eyebrow" style="margin-bottom:0.6rem;">Token</p>
    <textarea id="jwtInput" rows="4" placeholder="Paste a JWT (eyJhbGciOi...)…"
      style="width:100%;background:var(--bg-panel-raised);border:1px solid var(--border-glow);border-radius:8px;color:var(--text-primary);font-family:var(--font-mono);font-size:0.85rem;padding:0.85rem;resize:vertical;"></textarea>
  </section>

  <div class="tool-panel-grid">
    <section class="glass-card" style="padding:1.75rem;">
      <p class="eyebrow" style="margin-bottom:0.6rem;">Header</p>
      <pre id="jwtHeader" style="background:var(--bg-panel-raised);border-radius:8px;padding:0.85rem;color:var(--cyan);font-family:var(--font-mono);font-size:0.85rem;overflow:auto;min-height:120px;">—</pre>
    </section>
    <section class="glass-card" style="padding:1.75rem;">
      <p class="eyebrow" style="margin-bottom:0.6rem;">Payload</p>
      <pre id="jwtPayload" style="background:var(--bg-panel-raised);border-radius:8px;padding:0.85rem;color:var(--cyan);font-family:var(--font-mono);font-size:0.85rem;overflow:auto;min-height:120px;">—</pre>
    </section>
  </div>
  <p id="jwtStatus" style="margin-top:1rem;font-family:var(--font-mono);font-size:0.85rem;color:var(--text-dim);"></p>
</main>

<script src="../js/jwt-decoder.js"></script>
</body>
</html>
