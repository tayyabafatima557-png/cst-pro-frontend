<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Hash Generator — Cyber Security Toolkit Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/toolkit-theme.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="scanline-overlay"></div>
<nav class="navbar">
  <a href="../index.html" class="nav-brand"><span class="glow-text">CST</span><span>_Pro</span></a>
  <a href="../index.html#tools" class="nav-back">&larr; All Tools</a>
</nav>
<main class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">// tool_id: 24</p>
    <h1 class="glow-text tool-title">File Hash Generator</h1>
    <p class="tool-subtitle">Generate SHA-1, SHA-256, and SHA-512 hashes of any file — useful for verifying downloads or checking file integrity. Nothing is uploaded anywhere.</p>
  </div>

  <section class="glass-card" style="padding:2rem;margin-bottom:1.5rem;text-align:center;">
    <input type="file" id="fileInput" style="display:none;">
    <button class="btn-cyber" id="fileSelectBtn">Choose File</button>
    <p id="fileName" style="color:var(--text-dim);margin-top:1rem;font-size:0.85rem;"></p>
  </section>

  <div id="fileLoading" style="display:none;text-align:center;padding:2rem;"><div class="loader-spinner"></div></div>

  <section class="glass-card" id="fileResults" style="padding:1.75rem;display:none;">
    <div id="fileHashGrid" style="display:flex;flex-direction:column;gap:1rem;"></div>
  </section>
</main>

<script src="../js/file-hash-generator.js"></script>
</body>
</html>
