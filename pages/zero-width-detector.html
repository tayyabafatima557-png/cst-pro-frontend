<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero-Width Character Detector — Cyber Security Toolkit Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/toolkit-theme.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="scanline-overlay"></div>
<nav class="navbar">
  <a href="../index.html" class="nav-brand"><span class="glow-text">CST</span><span>_Pro</span></a>
  <a href="../index.html#tools" class="nav-back">&larr; All Tools</a>
</nav>
<main class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">// tool_id: 18</p>
    <h1 class="glow-text tool-title">Zero-Width Character Detector</h1>
    <p class="tool-subtitle">Detect invisible Unicode characters hidden in text — used for text steganography, watermarking, and fingerprinting leaked documents.</p>
  </div>

  <section class="glass-card" style="padding:1.75rem;margin-bottom:1.5rem;">
    <textarea id="zwInput" placeholder="Paste text here to scan for hidden zero-width characters..." style="width:100%;min-height:150px;background:var(--bg-panel-raised);border:1px solid var(--border-glow);border-radius:8px;color:var(--cyan);font-family:var(--font-mono);font-size:0.9rem;padding:1rem;box-sizing:border-box;resize:vertical;"></textarea>
    <div style="display:flex;gap:0.8rem;margin-top:1rem;flex-wrap:wrap;">
      <button class="btn-cyber" id="zwScanBtn">Scan</button>
      <button class="btn-cyber" id="zwCleanBtn" style="background:transparent;border:1px solid var(--cyan);">Copy Cleaned Text</button>
    </div>
  </section>

  <section class="glass-card" id="zwResults" style="padding:1.75rem;display:none;">
    <div id="zwSummary" style="margin-bottom:1rem;"></div>
    <div id="zwBreakdown" style="display:flex;flex-direction:column;gap:0.5rem;font-family:var(--font-mono);font-size:0.85rem;"></div>
  </section>
</main>

<script src="../js/zero-width-detector.js"></script>
</body>
</html>
