<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Checker — Cyber Security Toolkit Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/toolkit-theme.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="scanline-overlay"></div>
<nav class="navbar">
  <a href="../index.html" class="nav-brand"><span class="glow-text">CST</span><span>_Pro</span></a>
  <a href="../index.html#tools" class="nav-back">&larr; All Tools</a>
</nav>
<main class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">// tool_id: 02</p>
    <h1 class="glow-text tool-title">Password Strength Checker</h1>
    <p class="tool-subtitle">Analyze any password's entropy and get concrete suggestions to strengthen it.</p>
  </div>

  <section class="glass-card output-card" style="margin-bottom:1.5rem;">
    <div class="output-row">
      <input type="text" id="pwInput" class="password-display" placeholder="Type a password to analyze…" autocomplete="off" aria-label="Password to check">
      <button class="btn-icon" id="toggleVisibility" title="Show/hide" aria-label="Toggle visibility">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="strength-meter"><div class="strength-meter-fill" id="strengthFill"></div></div>
    <p class="strength-label" id="strengthLabel">Strength: —</p>
  </section>

  <section class="glass-card" style="padding:1.75rem;">
    <p class="eyebrow" style="margin-bottom:0.8rem;">Suggestions</p>
    <ul id="suggestionsList" style="list-style:none;padding:0;display:flex;flex-direction:column;gap:0.6rem;color:var(--text-dim);font-size:0.9rem;">
      <li>Start typing a password above to see suggestions.</li>
    </ul>
  </section>
</main>
<script src="../js/tools.js"></script>
<script src="../js/password-checker.js"></script>
</body>
</html>
