<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Reputation Checker — Cyber Security Toolkit Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/toolkit-theme.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="scanline-overlay"></div>
<nav class="navbar">
  <a href="../index.html" class="nav-brand"><span class="glow-text">CST</span><span>_Pro</span></a>
  <a href="../index.html#tools" class="nav-back">&larr; All Tools</a>
</nav>
<main class="tool-page">
  <div class="tool-header">
    <p class="eyebrow">// tool_id: 23</p>
    <h1 class="glow-text tool-title">URL Reputation Checker</h1>
    <p class="tool-subtitle">Search historical public scans of a URL via urlscan.io — see if it's been flagged, and what past scans found.</p>
  </div>

  <section class="glass-card" style="padding:1.75rem;margin-bottom:1.5rem;">
    <div class="output-row">
      <input type="text" id="urlRepInput" placeholder="e.g. example.com" class="password-display">
      <button class="btn-cyber" id="urlRepCheckBtn">Search</button>
    </div>
    <p style="font-size:0.8rem;color:var(--text-dim);margin-top:0.6rem;">Powered by <a href="https://urlscan.io" target="_blank" style="color:var(--cyan);">urlscan.io</a> public scan history — passive lookup only.</p>
  </section>

  <div id="urlRepLoading" style="display:none;text-align:center;padding:2rem;"><div class="loader-spinner"></div></div>
  <p id="urlRepError" style="color:var(--danger);text-align:center;margin-top:1rem;"></p>

  <section class="glass-card" id="urlRepResults" style="padding:1.75rem;display:none;">
    <p class="eyebrow" style="margin-bottom:1rem;" id="urlRepCount"></p>
    <div id="urlRepList" style="display:flex;flex-direction:column;gap:0.6rem;"></div>
  </section>
</main>

<script src="../js/url-reputation.js"></script>
</body>
</html>
